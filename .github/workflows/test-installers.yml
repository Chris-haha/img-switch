name: Native installer acceptance and verified release

on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Require Git transport before checkout
        run: git --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source directory and release gates without archives
        run: |
          python3 -B test_packaging_nozip.py
          python3 -B test_build_tools.py
          python3 -B packaging/test_select_python.py
          python3 -B packaging/test_ci_release.py
          python3 -B packaging/source/test_build_source.py
          mkdir -p artifacts/source
          python3 -B packaging/source/build_source.py --output artifacts/source/img-switch
          python3 -B packaging/runtime/nozip.py artifacts/source
      - name: Prepare private release draft after source checks
        id: draft
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B packaging/ci_release.py prepare

  windows:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      IMG_SWITCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require Git transport before checkout
        run: git --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select existing native Python with working Tk
        shell: pwsh
        run: |
          $selected = python -B packaging/select_python.py --expected-arch x86_64
          if ($LASTEXITCODE -ne 0) { throw 'No usable preinstalled native Python/Tk' }
          "PYTHON=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $selected -B packaging/prepare_tools.py --target build/tools
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency preparation failed' }
          "PYTHONPATH=$((Join-Path $PWD 'build/tools'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $iscc = 'C:\Program Files (x86)\Inno Setup 6'
          if (!(Test-Path "$iscc\ISCC.exe")) { throw 'Preinstalled Inno Setup 6 is required' }
          $iscc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Native regression checks
        shell: pwsh
        run: '& $env:PYTHON -B packaging/ci_checks.py tests --platform windows-x64 --record artifacts/windows-evidence.json'
      - name: Build installer
        shell: pwsh
        run: '& $env:PYTHON -B packaging/windows/build_windows.py --output artifacts/windows'
      - name: Actually install, exercise GUI and engine, and uninstall
        shell: pwsh
        run: |
          $version = & $env:PYTHON -B packaging/runtime/release_version.py --field VERSION
          & $env:PYTHON -B packaging/ci_checks.py smoke --platform windows-x64 --record artifacts/windows-evidence.json --package "artifacts/windows/IMG-Switch-$version-Windows-x64-unsigned-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native installer acceptance failed' }
          & $env:PYTHON -B packaging/runtime/nozip.py artifacts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected archive in outputs' }
      - name: Upload raw verified installer to private draft
        if: needs.source.outputs.release_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.source.outputs.release_id }}
        shell: pwsh
        run: |
          $version = & $env:PYTHON -B packaging/runtime/release_version.py --field VERSION
          & $env:PYTHON -B packaging/ci_release.py upload --release-id $env:RELEASE_ID --platform windows-x64 --package "artifacts/windows/IMG-Switch-$version-Windows-x64-unsigned-setup.exe" --evidence artifacts/windows-evidence.json

  macos:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      IMG_SWITCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      IMG_SWITCH_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Require Git transport before checkout
        run: git --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select existing native Python with working Tk
        run: |
          selected="$(python3 -B packaging/select_python.py --expected-arch "$IMG_SWITCH_EXPECTED_ARCH")"
          echo "PYTHON=$selected" >> "$GITHUB_ENV"
          "$selected" -B packaging/prepare_tools.py --target build/tools
          echo "PYTHONPATH=$PWD/build/tools" >> "$GITHUB_ENV"
      - name: Native regression checks
        run: '"$PYTHON" -B packaging/ci_checks.py tests --platform "macos-$IMG_SWITCH_EXPECTED_ARCH" --record artifacts/macos-evidence.json'
      - name: Build disk image
        run: bash packaging/macos/build.sh artifacts/macos
      - name: Mount and exercise actual GUI and standalone engine
        shell: bash
        run: |
          set -euo pipefail
          version="$("$PYTHON" -B packaging/runtime/release_version.py --field VERSION)"
          mountpoint="$RUNNER_TEMP/img-switch-test"
          mkdir -p "$mountpoint"
          hdiutil attach -readonly -nobrowse -quiet -mountpoint "$mountpoint" "artifacts/macos/IMG-Switch-$version-macOS-$IMG_SWITCH_EXPECTED_ARCH-unsigned.dmg"
          trap 'hdiutil detach "$mountpoint" -quiet' EXIT
          "$PYTHON" -B packaging/ci_checks.py smoke --platform "macos-$IMG_SWITCH_EXPECTED_ARCH" --record artifacts/macos-evidence.json --package "$mountpoint/IMG Switch.app"
          IMG_SWITCH_MACHO_DIAGNOSTICS=1 "$PYTHON" -B packaging/macos/audit_privacy.py "$mountpoint/IMG Switch.app"
          "$PYTHON" -B packaging/runtime/nozip.py artifacts/macos
      - name: Upload raw verified installer to private draft
        if: needs.source.outputs.release_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.source.outputs.release_id }}
        run: |
          version="$("$PYTHON" -B packaging/runtime/release_version.py --field VERSION)"
          "$PYTHON" -B packaging/ci_release.py upload --release-id "$RELEASE_ID" --platform "macos-$IMG_SWITCH_EXPECTED_ARCH" --package "artifacts/macos/IMG-Switch-$version-macOS-$IMG_SWITCH_EXPECTED_ARCH-unsigned.dmg" --evidence artifacts/macos-evidence.json

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-')
    needs: [source, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require Git transport before checkout
        run: git --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Re-download raw binaries, verify all three manifests, then publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.source.outputs.release_id }}
        run: python3 -B packaging/ci_release.py publish --release-id "$RELEASE_ID"
